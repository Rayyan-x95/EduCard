name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Placeholder Supabase credentials — required at import time by
      # src/constants/env.ts (zod-parsed). Never real secrets.
      EXPO_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit / integration tests
        run: npm run test

      - name: Dependency audit (critical)
        run: npm audit --audit-level=critical

      - name: Web production export
        env:
          # SDK 57 Metro/Rollup bundle can spike past the default 512MB heap
          # on shared CI runners — give it headroom to avoid OOM crashes.
          NODE_OPTIONS: --max-old-space-size=4096
        run: npx expo export --platform web --output-dir dist

      - name: Upload web bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
          retention-days: 7
